# Publica el ejecutable como release al etiquetar una versión.
#
# Para sacar una versión:
#
#     1. Subir el <Version> de AlgoritmoDevTools.Shell.csproj
#     2. git commit && git push
#     3. git tag -a v1.2.0 -m "Que cambio" && git push origin v1.2.0
#
# La etiqueta tiene que coincidir con el <Version> del csproj: es el número que queda adentro del
# ejecutable, y con el que cada instalación decide si la de GitHub es más nueva que la suya. Si no
# coinciden, el workflow falla antes de publicar nada en lugar de dejar un release que nadie va a
# poder usar para actualizar.
#
# Anotada y con mensaje, no liviana: ese mensaje es el cuerpo del release, y es lo único que el
# usuario lee en la pantalla de Actualizaciones antes de decidir si baja. Una etiqueta sin mensaje
# deja el release sin una palabra sobre lo que trae.

name: Publicar

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publicar:
    # Windows y no Linux: el ejecutable es WinExe con Windows Forms adentro, así que no compila en
    # otro lado.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # El mensaje de la etiqueta es lo que se muestra adentro de la aplicacion, y vive en el
          # objeto de la etiqueta, no en el commit: sin el historial completo no se puede leer.
          fetch-depth: 0

      # Dos versiones: la aplicacion es net10 y la extension de Visual Studio es net8, porque se lo
      # impone el SDK de extensibilidad, que no publica build para net10.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Verificar que la etiqueta coincida con la versión del proyecto
        shell: pwsh
        run: |
          $csproj = [xml](Get-Content AlgoritmoDevTools.Shell/AlgoritmoDevTools.Shell.csproj)
          $version = $csproj.Project.PropertyGroup.Version | Where-Object { $_ }
          $etiqueta = '${{ github.ref_name }}'.TrimStart('v')

          if ($version -ne $etiqueta) {
            Write-Error "La etiqueta dice $etiqueta y el csproj dice $version. El ejecutable saldria con un numero que no es el del release."
            exit 1
          }

          Write-Host "Version $version"

      - name: Publicar
        run: dotnet publish AlgoritmoDevTools.Shell -c Release -o salida

      # El .vsix va como segundo adjunto del release porque es de ahi que lo baja la aplicacion
      # cuando el usuario instala la extension desde Configuraciones. Si falta, el switch no tiene
      # de donde sacarlo y avisa que el release no lo trae.
      #
      # Se compila aparte y no sale del publish del Shell: son proyectos sin relacion entre si, y
      # el de la extension no se puede referenciar desde net10.
      - name: Compilar la extension de Visual Studio
        run: dotnet build AlgoritmoDevTools.Integrations.VisualStudio -c Release

      # El paquete se publica CON LA VERSION EN EL NOMBRE
      # (AlgoritmoDevTools.Integrations.VisualStudio.1.6.0.vsix) y eso no es cosmetico: es lo que le
      # permite a la aplicacion saber que version hay publicada sin bajar los 3,8 MB. La consulta del
      # release ya devuelve los nombres de los adjuntos, asi que averiguarlo sale gratis.
      - name: Sumar el paquete de la extension a lo que se publica
        shell: pwsh
        run: |
          $paquete = 'AlgoritmoDevTools.Integrations.VisualStudio/bin/Release/net8.0-windows/AlgoritmoDevTools.Integrations.VisualStudio.vsix'

          if (-not (Test-Path $paquete)) {
            Write-Error "No se genero el .vsix de la extension. Sin el, el release sale sin la extension y Configuraciones no la va a poder instalar."
            exit 1
          }

          $csproj = [xml](Get-Content AlgoritmoDevTools.Integrations.VisualStudio/AlgoritmoDevTools.Integrations.VisualStudio.csproj)
          $version = $csproj.Project.PropertyGroup.Version | Where-Object { $_ }

          if (-not $version) {
            Write-Error "El csproj de la extension no declara <Version>. Sin version en el nombre, la aplicacion no puede saber si hay una mas nueva."
            exit 1
          }

          $destino = "salida/AlgoritmoDevTools.Integrations.VisualStudio.$version.vsix"
          Copy-Item $paquete $destino
          Write-Host "Paquete de la extension: $destino ($([math]::Round((Get-Item $paquete).Length / 1MB, 1)) MB)"

      # Lo que se escribe al etiquetar es lo unico que cuenta que cambio en palabras del equipo.
      # generate_release_notes solo no alcanza: arma la lista a partir de los pull requests, y aca
      # se pushea derecho a master, asi que deja el release con el enlace de comparacion y nada mas.
      # Eso es lo que leia el usuario al actualizar.
      - name: Sacar las notas del mensaje de la etiqueta
        shell: pwsh
        run: |
          # actions/checkout deja la etiqueta como liviana aunque se haya anotado: crea la
          # referencia apuntando al commit y no trae el objeto de la etiqueta. Sin esto,
          # %(contents) devuelve el mensaje del COMMIT, y el release sale diciendo "Subir a
          # 1.1.0" con la linea de Co-Authored-By en lugar de los cambios. Paso en la v1.1.0 y
          # hubo que corregir el release a mano.
          git fetch --tags --force --quiet

          $notas = ''

          if ((git cat-file -t '${{ github.ref_name }}') -eq 'tag') {
            $notas = (git tag -l --format='%(contents)' '${{ github.ref_name }}') -join "`n"
          }
          else {
            # Sigue sin ser anotada: se pregunta por la API, que siempre tiene el objeto.
            Write-Host "La etiqueta no llego anotada al runner; se leen las notas por la API."
            $ref = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/${{ github.ref_name }}" | ConvertFrom-Json

            if ($ref.object.type -eq 'tag') {
              $notas = (gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($ref.object.sha)" | ConvertFrom-Json).message
            }
          }

          if ([string]::IsNullOrWhiteSpace($notas)) {
            # Etiqueta sin mensaje: liviana, o anotada sin texto. El release sale igual, con lo
            # unico que se sabe, en vez de salir en blanco.
            $notas = "Version ${{ github.ref_name }}."
            Write-Host "La etiqueta no trae mensaje: el release va a salir sin detalle de los cambios."
          }

          Set-Content -Path notas.md -Value $notas -Encoding utf8
          Write-Host $notas

      - name: Crear el release con el ejecutable y la extension
        uses: softprops/action-gh-release@v2
        with:
          files: |
            salida/DevTools.exe
            salida/AlgoritmoDevTools.Integrations.VisualStudio.*.vsix
          body_path: notas.md
          generate_release_notes: true
